name: Build KeyboardToolbarAI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scheme:
        description: Package scheme
        type: choice
        options: [roothide, rootless]
        default: roothide

permissions:
  contents: write

concurrency:
  group: keyboardtoolbarai-${{ github.ref }}-${{ inputs.scheme || 'roothide' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      THEOS: ${{ github.workspace }}/.theos-ci
      THEOS_PACKAGE_SCHEME: ${{ github.event_name == 'workflow_dispatch' && inputs.scheme || 'roothide' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check source scope and delivered v2 provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cloud-output
          python3 Tests/check_project.py | tee cloud-output/project-checks.json
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          record=json.loads(Path('ci/v2_source_manifest.json').read_text())
          for item in record['files']:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()==item['sha256'], item['path']
          Path('cloud-output/source-manifest.json').write_text(json.dumps(record,ensure_ascii=False,indent=2))
          print('Delivered v2 source hashes verified:',len(record['files']))
          PY

      - name: Select Xcode and install host tools
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcrun --find clang
          brew install dpkg ldid

      - name: Bump package version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          VERSION="5.2.0-${{ github.run_number }}"
          sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$GITHUB_SHA" > cloud-output/commit.txt

      - name: Fetch Theos and iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$THEOS_PACKAGE_SCHEME" == roothide ]]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          else
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git "$THEOS"
          fi
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -a "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          git -C "$THEOS" rev-parse HEAD > cloud-output/theos-commit.txt
          git -C "$RUNNER_TEMP/theos-sdks" rev-parse HEAD > cloud-output/sdk-repository-commit.txt
          xcrun clang --version > cloud-output/compiler.txt

      - name: Execute shared geometry tests and cross-compile native tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -Wall -Wextra -Werror Tests/geometry.c -lm -o "$RUNNER_TEMP/keyboardtoolbarai-geometry"
          "$RUNNER_TEMP/keyboardtoolbarai-geometry" | tee cloud-output/geometry-tests.json
          for arch in arm64 arm64e; do
            xcrun clang -target "$arch-apple-ios15.0" -isysroot "$THEOS/sdks/iPhoneOS16.5.sdk" -fobjc-arc -fblocks -fno-autolink -Wall -Wextra -Werror -I./Sources -c Tests/NativeTests.m -o "$RUNNER_TEMP/keyboardtoolbarai-native-tests.$arch.o"
          done

      - name: Build package with Apple linker
        shell: bash
        run: |
          set -euo pipefail
          sh build.sh "$THEOS_PACKAGE_SCHEME" 2>&1 | tee cloud-output/build.log
          find ./packages -type f -name '*.deb' -print

      - name: Verify package architecture and code signature pages
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(find packages -type f -name '*.deb' -print -quit)
          test -n "$PACKAGE"
          python3 ci/verify_package.py "$PACKAGE" "$THEOS_PACKAGE_SCHEME" cloud-output/package-verification.json
          cp "$PACKAGE" cloud-output/
          cp control cloud-output/control.txt

      - name: Upload verified package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardToolbarAI-${{ env.THEOS_PACKAGE_SCHEME }}-${{ github.run_number }}
          path: cloud-output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardToolbarAI-diagnostics-${{ github.run_number }}
          path: cloud-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish private repository release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: keyboardtoolbarai-${{ env.THEOS_PACKAGE_SCHEME }}-v${{ steps.bump.outputs.package_version }}
          name: "键盘工具栏 AI v${{ steps.bump.outputs.package_version }} (${{ env.THEOS_PACKAGE_SCHEME }})"
          files: cloud-output/*.deb
